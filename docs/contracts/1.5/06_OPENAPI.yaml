components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 서버가 발급한 사용자 범위 세션 토큰. 요청 member_id/household_id를 신뢰하지 않고 인증 주체와
        비교.
  schemas:
    Error:
      type: object
      properties:
        code: *id003
        message: *id003
        request_id: *id003
        details:
          type: object
          additionalProperties: true
      required:
      - code
      - message
      - request_id
      additionalProperties: false
    ErrorEnvelope:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/Error'
      required:
      - error
      additionalProperties: false
    Page:
      type: object
      properties:
        limit:
          type: integer
        offset:
          type: integer
        total:
          type: integer
      required:
      - limit
      - offset
      - total
      additionalProperties: false
    AcceptedJob:
      additionalProperties: false
      properties:
        job_id:
          format: uuid
          type: string
        status:
          enum:
          - QUEUED
          - RUNNING
          - SUCCEEDED
          - READY
          - FAILED
          - TIMED_OUT
          - CANCELLED
          type: string
        status_url:
          type: string
      required:
      - job_id
      - status
      - status_url
      type: object
    Asset:
      type: object
      properties:
        asset_id: *id002
        asset_key: *id003
        content_type: *id003
        read_url:
          anyOf:
          - type: string
          - type: 'null'
        expires_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
      required:
      - asset_id
      - asset_key
      - content_type
      additionalProperties: false
    Member:
      additionalProperties: false
      properties:
        id:
          format: uuid
          type: string
        household_id:
          format: uuid
          type: string
        display_name:
          type: string
        role:
          enum:
          - OWNER
          - MEMBER
          - CHILD
          type: string
      required:
      - id
      - household_id
      - display_name
      - role
      type: object
    SessionStartRequest:
      type: object
      properties:
        household_id: *id002
        member_id: *id002
        demo_mode:
          type: boolean
      required:
      - household_id
      - member_id
      additionalProperties: false
    SessionStartResponse:
      type: object
      properties:
        session_id: *id002
        access_token: *id003
        token_type:
          type: string
          enum:
          - Bearer
        expires_at: &id007
          type: string
          format: date-time
        member:
          $ref: '#/components/schemas/Member'
        capabilities:
          type: array
          items: *id003
      required:
      - session_id
      - access_token
      - token_type
      - expires_at
      - member
      - capabilities
      additionalProperties: false
    Garment:
      additionalProperties: false
      properties:
        id:
          format: uuid
          type: string
        owner_id:
          format: uuid
          type: string
        category:
          type: string
        color:
          type: string
        material:
          anyOf:
          - type: string
          - type: 'null'
        season_tags:
          items:
            type: string
          type: array
        image:
          anyOf:
          - $ref: '#/components/schemas/Asset'
          - type: 'null'
        status:
          enum:
          - AVAILABLE
          - IN_USE
          - LAUNDRY
          - CARE
          - STORED
          - UNKNOWN
          - RETIRED
          type: string
        care_label:
          anyOf:
          - type: string
          - type: 'null'
        location_label:
          anyOf:
          - type: string
          - type: 'null'
        stale:
          type: boolean
        care_guide_available:
          type: boolean
        care_guide_url:
          anyOf:
          - type: string
          - type: 'null'
        shared_with_member_ids:
          items:
            format: uuid
            type: string
          type: array
        location_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
        location_confidence:
          anyOf:
          - type: number
          - type: 'null'
        last_seen_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
        version:
          type: integer
      required:
