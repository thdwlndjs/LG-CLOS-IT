        limit:
          type: integer
        offset:
          type: integer
        total:
          type: integer
      required:
      - limit
      - offset
      - total
      additionalProperties: false
    AcceptedJob:
      additionalProperties: false
      properties:
        job_id:
          format: uuid
          type: string
        status:
          enum:
          - QUEUED
          - RUNNING
          - SUCCEEDED
          - READY
          - FAILED
          - TIMED_OUT
          - CANCELLED
