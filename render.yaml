# Free prototype: Supabase PostgreSQL/private S3, no paid Render resources.
services:
- type: keyvalue
  name: wardrobe-redis
  region: singapore
  plan: free
  ipAllowList: []
  maxmemoryPolicy: noeviction
- type: web
  name: wardrobe-api
  runtime: docker
  region: singapore
  plan: free
  branch: main
  autoDeployTrigger: off
  dockerContext: .
  dockerfilePath: ./infra/cloud/Dockerfile
  healthCheckPath: /health/ready
  envVars:
  - key: REDIS_URL
    fromService:
      name: wardrobe-redis
      type: keyvalue
      property: connectionString
  - key: JWT_SECRET
    generateValue: true
  - key: DATABASE_URL
    sync: false
  - key: SUPABASE_URL
    sync: false
  - key: SUPABASE_SERVICE_ROLE_KEY
    sync: false
  - key: STORAGE_ENDPOINT
    sync: false
  - key: STORAGE_REGION
    sync: false
  - key: STORAGE_ACCESS_KEY
    sync: false
  - key: STORAGE_SECRET_KEY
    sync: false
  - key: PUBLIC_DEMO_LOGIN_ENABLED
    sync: false
  - key: PUBLIC_DEMO_MEMBER_ID
    sync: false
  - key: API_PUBLIC_ORIGIN
    sync: false
  - key: CORS_ALLOWED_ORIGINS
    sync: false
  - key: STORAGE_PROVIDER
    value: SUPABASE
  - key: STORAGE_BUCKET
    value: wardrobe-assets
  - key: VTON_PROVIDER
    value: MOCK
  - key: WEATHER_PROVIDER
    value: MOCK
  - key: CALENDAR_PROVIDER
    value: MOCK
