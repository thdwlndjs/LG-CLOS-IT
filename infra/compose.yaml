name: smart-wardrobe

x-backend: &backend
  build:
    context: ..
    dockerfile: backend/Dockerfile
  env_file: ../.env
  init: true
  networks: [default, render-private]

services:
  postgres:
    image: postgres:16.8-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Run bootstrap first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run bootstrap first}
      POSTGRES_DB: ${POSTGRES_DB:-wardrobe}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  minio:
    image: smart-wardrobe-minio:RELEASE.2025-04-22T22-12-26Z-local
    build:
      context: ./minio
      dockerfile: Dockerfile
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:?Run bootstrap first}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:?Run bootstrap first}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["minio-data:/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 30

  storage-init:
    <<: *backend
    command: ["python", "/workspace/scripts/init_storage.py"]
    depends_on:
      minio: {condition: service_healthy}
    restart: "no"

  api:
    <<: *backend
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      storage-init: {condition: service_completed_successfully}
      renderer: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20

  worker:
    <<: *backend
    command: ["python", "-m", "celery", "-A", "app.workers.celery_app:celery_app", "worker", "--loglevel=INFO", "--concurrency=1", "--beat", "--schedule=/tmp/wardrobe-celerybeat"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      storage-init: {condition: service_completed_successfully}
      renderer: {condition: service_healthy}

  renderer:
    build:
      context: ..
      dockerfile: renderer/Dockerfile
    init: true
    shm_size: 256mb
    networks: [render-private]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres-test:
    image: postgres:16.8-bookworm
    profiles: ["test"]
    environment:
      POSTGRES_USER: wardrobe_test
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run bootstrap first}
      POSTGRES_DB: wardrobe_test
    ports: ["127.0.0.1:55432:5432"]
    tmpfs: ["/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "wardrobe_test", "-d", "wardrobe_test"]
      interval: 3s
      timeout: 3s
      retries: 30

  tests:
    <<: *backend
    profiles: ["test"]
    environment:
      APP_ENV: test
      TEST_DATABASE_URL: postgresql+asyncpg://wardrobe_test:${POSTGRES_PASSWORD}@postgres-test:5432/wardrobe_test
    command: ["python", "-m", "pytest", "tests/integration", "-q"]
    depends_on:
      postgres-test: {condition: service_healthy}

volumes:
  postgres-data:
  redis-data:
  minio-data:

networks:
  render-private:
    internal: true
