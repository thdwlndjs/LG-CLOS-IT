# Explicitly target an independently verified Engine; never use the default context.
# No API, init, migration, seed, or worker runs during storage recovery.
name: wardrobe-recovery-demo
services:
  postgres:
    image: postgres:16.8-bookworm
    environment:
      POSTGRES_USER: ${RECOVERY_POSTGRES_USER:?Explicit recovery identity required}
      POSTGRES_PASSWORD: ${RECOVERY_POSTGRES_PASSWORD:?Private credential required}
      POSTGRES_DB: wardrobe_demo_recovered
    ports: ["127.0.0.1:57433:5432"]
    volumes: ["recovery-postgres:/var/lib/postgresql/data"]
    restart: "no"
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 3s
      retries: 12
  minio:
    image: wardrobe-recovery-minio:RELEASE.2025-04-22T22-12-26Z
    build:
      context: ./minio
      dockerfile: Dockerfile
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${RECOVERY_STORAGE_ACCESS_KEY:?Private credential required}
      MINIO_ROOT_PASSWORD: ${RECOVERY_STORAGE_SECRET_KEY:?Private credential required}
    ports: ["127.0.0.1:19100:9000", "127.0.0.1:19101:9001"]
    volumes: ["recovery-minio:/data"]
    restart: "no"
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 3s
      retries: 12
  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports: ["127.0.0.1:16479:6379"]
    volumes: ["recovery-redis:/data"]
    restart: "no"
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 12
volumes:
  recovery-postgres:
  recovery-minio:
  recovery-redis:
