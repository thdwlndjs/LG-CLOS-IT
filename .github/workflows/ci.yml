name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm test && npm run build
        working-directory: web

  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.9'
      - run: python -m pip install --require-hashes -r backend/requirements.lock
      - run: python -m ruff check backend/app scripts
      - run: python scripts/bootstrap.py
      - name: Unit and contracts
        run: python -m pytest backend/tests/unit backend/tests/contract backend/tests/test_integration_credentials.py -q -p no:cacheprovider
      - name: Start disposable integration services
        run: |
          docker compose --env-file .env -f infra/compose.yaml --profile test up -d --build --wait postgres-test redis minio renderer
          docker compose --env-file .env -f infra/compose.yaml run --rm storage-init
      - name: Real PostgreSQL, Redis, storage and renderer integration
        run: docker compose --env-file .env -f infra/compose.yaml --profile test run --rm tests
      - name: Validate OpenAPI
        run: python -m openapi_spec_validator docs/06_OPENAPI.yaml
      - name: Stop disposable services
        if: always()
        run: docker compose --env-file .env -f infra/compose.yaml --profile test down

  free-cloud-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build non-root combined API and renderer image
        run: docker build -f infra/cloud/Dockerfile -t wardrobe-free-cloud:ci .
      - name: Verify renderer under free-tier memory limit
        run: |
          docker run --rm --memory 512m --memory-swap 512m --cpus 0.5 \
            --entrypoint node -w /workspace/renderer \
            -v "$PWD/renderer/test:/workspace/renderer/test:ro" \
            wardrobe-free-cloud:ci --test test/*.test.mjs

  deploy:
    needs: [frontend, backend, free-cloud-image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.9'
      - run: python -m pip install --require-hashes -r backend/requirements.lock
      - name: Deploy tested commit to Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          EXPECTED_REVISION: ${{ github.sha }}
        run: python scripts/trigger_render_deploy.py
