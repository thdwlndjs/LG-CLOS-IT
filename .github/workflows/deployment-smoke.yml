name: Deployment smoke

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deployment-smoke-main
  cancel-in-progress: true

jobs:
  verify:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.9'
      - run: python -m pip install --require-hashes -r backend/requirements.lock
      - name: Check deployed revision and readiness
        env:
          API_ORIGIN: ${{ vars.PUBLIC_API_ORIGIN }}
          WEB_ORIGIN: ${{ vars.PUBLIC_WEB_ORIGIN }}
          EXPECTED_REVISION: ${{ github.event.workflow_run.head_sha }}
        run: >-
          python scripts/check_deployment.py
          --api "$API_ORIGIN" --web "$WEB_ORIGIN"
          --revision "$EXPECTED_REVISION" --timeout 900
